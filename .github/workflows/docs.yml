name: docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docs:
    runs-on: macos-latest  # windows not working due to OpenGL error in vispy

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        env:
          BIN: ${{ matrix.os == 'windows-latest' && 'Scripts' || 'bin' }}
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/$BIN" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[docs]

      - name: Build Rust extension
        run: maturin develop --release

      - name: Generate screenshots
        run: python docs/scripts/_screenshots.py

      - name: Build docs
        run: zensical build --strict

      - name: Deploy docs to GitHub Pages
        if: github.event_name == 'push'
        run: ghp-import --no-jekyll --push --force -m "Deployed ${GITHUB_SHA} with Zensical" site
